# Spark Declarative Pipelines project definition for Layer 2 (History
# Tracking). Bronze (transformations/bronze.py) and silver
# (transformations/silver_history_scd2.py - AUTO CDC INTO, attribute-type
# conflict-resolution precedence, see DECISIONS.md "Layer 2: conflict
# resolution across sources") are wired up, deployed, and run for real. No
# gold table lives in this SDP pipeline: Layer 3 (cohort z-scores/HHI) is
# built as plain PySpark instead (notebooks/03_analytics.py), same
# reasoning as the Layer 1 vs. Layer 2 split - see DECISIONS.md, "Layer 3:
# hand-written PySpark, not SDP declarative primitives." transformations/
# gold_analytics.py stays an intentional stub pointing to that decision,
# not a placeholder for unfinished work.
name: provider_intelligence_history_tracking

catalog: provider_intelligence
schema: bronze

libraries:
  - glob:
      include: transformations/**

configuration:
  pipelines.reset.allowed: "true"  # still pre-gold, no downstream consumers yet - safe to reset while iterating
